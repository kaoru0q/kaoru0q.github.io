<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik Hanif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <!-- Header -->
        <div class="header">
            <h1>My Favorite Music</h1>
            <p>by Hanif & Deepseek</p>
        </div>

        <!-- Now Playing -->
        <div class="now-playing">
            <div class="album-art">
                <img id="cover" src="gambar/song1.jpg" alt="Album Cover">
            </div>
            
            <div class="song-info">
                <h2 id="title">Chinmoku no Majo</h2>
                <p id="artist">Yoshihisa Kato</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar" id="progress-container">
                    <div class="progress" id="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="control-btn" id="prev-btn" title="Previous">
                    <i class="fas fa-step-backward"></i>
                </button>
                
                <button class="control-btn play-btn" id="play-btn" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                
                <button class="control-btn" id="next-btn" title="Next">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <!-- Repeat Button -->
            <button class="mode-btn" id="repeat-btn" title="Repeat">
                <i class="fas fa-redo"></i>
                <span id="repeat-text">Repeat: Off</span>
            </button>
        </div>

        <!-- Playlist -->
        <div class="playlist">
            <h3>
                <i class="fas fa-music"></i>
                My Playlist
            </h3>
            <div id="playlist-items">
                <!-- Playlist will be loaded by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio" preload="metadata"></audio>

    <!-- Debug console -->
    <div id="debug" style="display:none; position:fixed; top:10px; right:10px; background:red; color:white; padding:10px; z-index:1000;"></div>

    <script src="script.js"></script>
</body>
</html>
