<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musik Hanif</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <base href="https://kaoru0q.github.io/">
</head>
<body>

<div class="welcome">
  <h1><i class="fas fa-music"></i> Musik Hanif</h1>
  <p>Enjoy your favorite music with this beautiful player</p>
  
  <div class="settings">
    <div class="setting-item">
      <i class="fas fa-redo"></i>
      <span id="repeat-status">Repeat: Off</span>
    </div>
    <div class="setting-item">
      <i class="fas fa-play-circle"></i>
      <span id="autoplay-status">Auto-play: On</span>
    </div>
  </div>
  
  <div class="social-links">
    <a href="https://github.com/kacru0q" target="_blank" class="social-link">
      <i class="fab fa-github"></i> GitHub
    </a>
    <a href="https://instagram.com" target="_blank" class="social-link">
      <i class="fab fa-instagram"></i> Instagram
    </a>
  </div>
  
  <div class="song-list">
    <h3><i class="fas fa-list-music"></i> Current Playlist</h3>
    <div class="song-item">Chinmoku no Majo - Yoshihisa Kato</div>
    <div class="song-item">Mizlecca - Hagali</div>
    <div class="song-item">Fig Luudhran - Hagali</div>
    <div class="song-item">Ebari and The Forest - Hagali</div>
  </div>
</div>

<div class="player">
  <div class="info">
    <img id="cover" src="gambar/song1.jpg" alt="Album Cover">
    <div>
      <h3 id="title">Chinmoku no Majo</h3>
      <p id="artist">Yoshihisa Kato</p>
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>
  </div>

  <input type="range" id="progress" value="0" min="0" max="100">

  <div class="controls">
    <button id="repeat-btn" title="Repeat Mode">
      <i class="fas fa-redo"></i>
    </button>
    
    <button id="prev" title="Previous Song">
      <i class="fas fa-backward"></i>
    </button>
    
    <button id="play" title="Play/Pause">
      <i class="fas fa-play"></i>
    </button>
    
    <button id="next" title="Next Song">
      <i class="fas fa-forward"></i>
    </button>
    
    <button id="autoplay-btn" title="Auto-play">
      <i class="fas fa-play-circle"></i>
    </button>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>

<!-- Font Awesome for icons -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
